services:
  - type: web
    name: lounge-spirits
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run server
    envVars:
      - key: DATABASE_URL
        sync: false # set this manually in the Render dashboard to your Neon connection string
      - key: NODE_VERSION
        value: 22.12.0
